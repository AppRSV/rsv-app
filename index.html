<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RSV · Control de Móviles</title>
<meta name="theme-color" content="#6b4078">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--accent:#6b4078;--deep:#3b2448;--soft:#f3edf6;--ink:#241a2c;--muted:#6c6177;--line:#e7e1ed;--bg:#faf8fb;--surface:#fff;--ok:#0e7a49;--okbg:#e7f5ee;--bad:#b42318;--badbg:#fdecea;--warn:#a8520a;--warnbg:#fdf0dc}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,input,select{font:inherit}
.band{background:var(--accent);color:#fff;padding:14px 18px 12px;display:flex;align-items:center;gap:14px}
.band img.sr{height:38px}.band img.rsv{height:42px;width:42px;border-radius:50%;margin-left:auto}
.band .t small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.band .t b{font-size:20px}
.stripe{height:5px;background:linear-gradient(90deg,#4e2a5c 25%,#f7d260 25% 50%,#e0418a 50% 75%,#4a87c6 75%)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.login{max-width:380px;margin:28px auto;display:grid;gap:12px}
.login h1{margin:0 0 4px;font-size:20px;color:var(--deep)}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-align:left}
.msg{padding:9px 12px;border-radius:8px;font-size:14px}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.info{background:var(--soft);color:var(--deep)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .who{font-weight:700}.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.spacer{flex:1}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
nav.tabs button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.addrow input{flex:1 1 160px;width:auto}
.muted{color:var(--muted)}
.pend{background:var(--warnbg)}
.foot{height:5px;background:linear-gradient(90deg,#4e2a5c 25%,#f7d260 25% 50%,#e0418a 50% 75%,#4a87c6 75%);position:fixed;left:0;right:0;bottom:0}
@media (max-width:600px){.band .t b{font-size:17px}.band img.sr{height:30px}}
</style>
</head>
<body>
<header class="band"><img class="sr" src="logo-sr.png" alt="San Ramón"><div class="t"><small>Red de Seguridad Vecinal</small><b>Control de Móviles</b></div><img class="rsv" src="logo-rsv.jpg" alt="RSV"></header>
<div class="stripe"></div>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<div class="foot"></div>
<script src="app.js"></script>
</body>
</html>
